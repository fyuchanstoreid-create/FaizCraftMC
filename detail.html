<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="author" content="FaizCraftMC">
  <meta name="copyright" content="FaizCraftMC 2026">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta property="og:title" content="FaizCraftMC Marketplace">
  <meta property="og:description" content="Detail addon Minecraft">
  <meta property="og:site_name" content="FaizCraftMC Marketplace">
  <title>Detail - FaizCraftMC Marketplace</title>
  <link rel="icon" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <style>
    body.detail-page {
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    .detail-back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 2100;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,71,87,0.3);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .detail-back-btn:hover {
      background: #ff4757;
      transform: scale(1.05);
    }
    .detail-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0c15;
      z-index: 2000;
      overflow-y: auto;
      display: block;
    }
    .detail-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.5);
    }
    .detail-loading i {
      margin-right: 1rem;
      color: #ff4757;
    }
    .detail-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .detail-error i {
      font-size: 4rem;
      color: #ff4757;
      margin-bottom: 1rem;
    }
    .detail-error h2 {
      margin-bottom: 0.5rem;
    }
    .detail-error p {
      opacity: 0.6;
    }
    .detail-error a {
      margin-top: 1.5rem;
      color: #ff4757;
      text-decoration: none;
      font-weight: 600;
      padding: 0.6rem 2rem;
      border: 1px solid #ff4757;
      border-radius: 30px;
      transition: 0.3s;
    }
    .detail-error a:hover {
      background: #ff4757;
      color: white;
    }
  </style>
</head>
<body>
  <a href="index.html" class="detail-back-btn" id="backToHome">
    <i class="fas fa-arrow-left"></i>
  </a>

  <div id="detailFullscreen" class="detail-fullscreen">
    <div class="detail-header">
      <h2>
        <i class="fas fa-crown"></i>
        <span id="detailTitleText">Content Details</span>
      </h2>
    </div>
    <div class="detail-body-full" id="detailBodyFull">
      <div class="detail-loading">
        <i class="fas fa-spinner fa-pulse"></i> Loading...
      </div>
    </div>
  </div>

  <script>
    let db = null;
    let allItems = [];
    let currentItemId = null;
    let currentLanguage = 'en';
    let swiperInstance = null;
    let originalDescription = '';

    const DEFAULT_IMAGE = 'https://picsum.photos/id/20/400/200';
    const DEFAULT_DETAIL_IMAGE = 'https://picsum.photos/id/20/800/400';

    const translations = {
      en: {
        detailTitle: 'Content Details',
        linkAvailable: 'Link Available',
        linkNotAvailable: 'Link Not Available',
        download: 'Download Now',
        linkUnavailable: 'Link Not Available',
        rating: 'Rate It',
        translate: 'Translate',
        loading: 'Loading...',
        notFound: 'Item Not Found'
      },
      id: {
        detailTitle: 'Detail Konten',
        linkAvailable: 'Tautan Tersedia',
        linkNotAvailable: 'Tautan Tidak Tersedia',
        download: 'Unduh Sekarang',
        linkUnavailable: 'Tautan Tidak Tersedia',
        rating: 'Beri Rating',
        translate: 'Terjemahkan',
        loading: 'Memuat...',
        notFound: 'Item Tidak Ditemukan'
      }
    };
    
    function sanitizeHTML(str) {
      if (!str) return '';
      const temp = document.createElement('div');
      temp.textContent = str;
      return temp.innerHTML;
    }

    function safeEscape(str) {
      return sanitizeHTML(str);
    }

    function showToast(msg, isErr = false) {
      const toast = document.createElement('div');
      toast.className = `toast ${isErr ? 'error' : ''}`;
      toast.innerHTML = `<i class="fas ${isErr ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${safeEscape(msg)}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function isLinkValid(url) {
      if (!url) return false;
      if (url === '#' || url === '' || url === 'https://#' || url === 'http://#') return false;
      return true;
    }

    function isValidImageUrl(url) {
      if (!url || url === '') return false;
      if (url.match(/^[A-Za-z]:\\/i) || url.match(/^file:\/\//i)) return false;
      if (url.includes('drive.google.com')) return false;
      return true;
    }

    function getValidImageUrl(url, isDetail = false) {
      return isValidImageUrl(url) ? url : (isDetail ? DEFAULT_DETAIL_IMAGE : DEFAULT_IMAGE);
    }

    function formatNumber(n) {
      return n?.toLocaleString() || '0';
    }

    function getCategoryIcon(cat) {
      const icons = {
        addon: '🧩',
        texture: '🎨',
        world: '🌍',
        skin: '👤',
        mashup: '⚡'
      };
      return icons[cat] || '📦';
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const patterns = [
        /(?:youtube\.com\/watch\?v=)([^&]+)/,
        /(?:youtu\.be\/)([^?]+)/,
        /(?:youtube\.com\/embed\/)([^?]+)/
      ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    function getYouTubeEmbedUrl(url, autoplay = false) {
      const videoId = extractYouTubeId(url);
      if (videoId) return `https://www.youtube.com/embed/${videoId}?autoplay=${autoplay ? 1 : 0}&rel=0&enablejsapi=1`;
      return null;
    }

    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function translateText(text, targetLang) {
      if (!text || targetLang === 'en') return text;
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        return data[0].map(item => item[0]).join('');
      } catch (e) {
        return text;
      }
    }
    
    function renderDetail(item) {
      const body = document.getElementById('detailBodyFull');
      const t = translations[currentLanguage];

      if (!item) {
        body.innerHTML = `
          <div class="detail-error">
            <i class="fas fa-exclamation-circle"></i>
            <h2>${t.notFound}</h2>
            <p>Item tidak ditemukan atau telah dihapus.</p>
            <a href="index.html">Kembali ke Beranda</a>
          </div>
        `;
        return;
      }

      const rating = item.rating || 5;
      const starsHtml = '★'.repeat(rating) + '☆'.repeat(5 - rating);
      const linkValid = isLinkValid(item.downloadUrl);
      originalDescription = item.description || '';

      const slides = [];
      let hasVideo = false;
      const youtubeUrl = getYouTubeEmbedUrl(item.videoUrl || '', true);
      if (youtubeUrl) {
        hasVideo = true;
        slides.push(`
          <div class="swiper-slide">
            <div class="video-wrapper">
              <iframe src="${safeEscape(youtubeUrl)}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>
        `);
      }
      const mainImg = getValidImageUrl(item.imageUrl, true);
      slides.push(`
        <div class="swiper-slide">
          <img src="${safeEscape(mainImg)}" alt="${safeEscape(item.title)}" onerror="this.src='${DEFAULT_DETAIL_IMAGE}'">
        </div>
      `);
      let extraImages = [];
      if (item.extraImages) {
        if (typeof item.extraImages === 'string') {
          extraImages = item.extraImages.split(',').map(url => url.trim()).filter(url => isValidImageUrl(url));
        } else if (Array.isArray(item.extraImages)) {
          extraImages = item.extraImages.filter(url => isValidImageUrl(url));
        }
      }
      extraImages.forEach(imgUrl => {
        slides.push(`
          <div class="swiper-slide">
            <img src="${safeEscape(imgUrl)}" alt="${safeEscape(item.title)}" onerror="this.src='${DEFAULT_DETAIL_IMAGE}'">
          </div>
        `);
      });

      const slidesHtml = slides.join('');
      const hasMultipleSlides = slides.length > 1;
      const title = safeEscape(item.title);
      const category = safeEscape(item.category?.toUpperCase() || '');
      const icon = getCategoryIcon(item.category);
      const downloads = formatNumber(item.downloads || 0);
      const descText = safeEscape(originalDescription);

      body.innerHTML = `
        <div class="detail-swiper-wrapper">
          <div class="detail-swiper-container ${!hasMultipleSlides ? 'hide-navigation' : ''}">
            <div class="detail-swiper swiper">
              <div class="swiper-wrapper">${slidesHtml}</div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
          </div>
          <div class="detail-swiper-pagination"></div>
        </div>
        <div class="detail-info-full">
          <h1>
            ${title}
            ${linkValid
              ? `<span class="link-status available"><i class="fas fa-link"></i> ${safeEscape(t.linkAvailable)}</span>`
              : `<span class="link-status unavailable"><i class="fas fa-exclamation-triangle"></i> ${safeEscape(t.linkNotAvailable)}</span>`
            }
          </h1>
          <div class="detail-category-badge">${icon} ${category}</div>
          <div class="translate-section">
            <label><i class="fas fa-language"></i> Translate Description:</label>
            <select id="languageSelect" class="language-select">
              <option value="en">🇬🇧 English (Original)</option>
              <option value="id">🇮🇩 Indonesia</option>
              <option value="ar">🇸🇦 العربية</option>
              <option value="zh">🇨🇳 中文</option>
              <option value="ja">🇯🇵 日本語</option>
              <option value="ko">🇰🇷 한국어</option>
              <option value="es">🇪🇸 Español</option>
              <option value="fr">🇫🇷 Français</option>
              <option value="de">🇩🇪 Deutsch</option>
              <option value="ru">🇷🇺 Русский</option>
              <option value="hi">🇮🇳 हिन्दी</option>
              <option value="pt">🇵🇹 Português</option>
              <option value="it">🇮🇹 Italiano</option>
              <option value="tr">🇹🇷 Türkçe</option>
              <option value="th">🇹🇭 ภาษาไทย</option>
              <option value="vi">🇻🇳 Tiếng Việt</option>
              <option value="ms">🇲🇾 Bahasa Melayu</option>
            </select>
            <button id="translateBtn" class="translate-btn"><i class="fas fa-language"></i> ${safeEscape(t.translate)}</button>
          </div>
          <div class="description-box" id="descriptionBox">
            <p id="descriptionText" style="white-space: pre-wrap; word-wrap: break-word;">${descText}</p>
          </div>
          <div class="detail-rating-full">
            <div>
              <span class="rating-stars-display">${starsHtml}</span>
              <span style="margin-left:0.5rem;">${rating}/5</span>
            </div>
            <div class="rating-input-full">
              <span><i class="fas fa-star" style="color:#ffa502;"></i> ${safeEscape(t.rating)}:</span>
              <div class="rating-stars-input-full" id="ratingStarsInputFull">
                ${[1,2,3,4,5].map(r => `<i class="far fa-star" data-rating="${r}"></i>`).join('')}
              </div>
            </div>
          </div>
          <div class="detail-download-full">
            <span><i class="fas fa-download"></i> ${downloads} downloads</span>
            <button class="download-btn-full ${!linkValid ? 'disabled' : ''}" data-url="${safeEscape(item.downloadUrl)}" data-id="${safeEscape(item.id)}" ${!linkValid ? 'disabled' : ''}>
              <i class="fas fa-download"></i> ${linkValid ? safeEscape(t.download) : safeEscape(t.linkUnavailable)}
            </button>
          </div>
        </div>
      `;

      if (swiperInstance) {
        swiperInstance.destroy(true, true);
        swiperInstance = null;
      }
      if (slides.length > 0) {
        const swiperContainer = body.querySelector('.detail-swiper');
        swiperInstance = new Swiper(swiperContainer, {
          slidesPerView: 1,
          spaceBetween: 0,
          loop: hasMultipleSlides,
          navigation: {
            nextEl: body.querySelector('.detail-swiper-container .swiper-button-next'),
            prevEl: body.querySelector('.detail-swiper-container .swiper-button-prev')
          },
          autoplay: false,
          on: {
            init: function() {
              setupAutoplayControl(this, hasVideo);
              updateCustomPagination(this, body.querySelector('.detail-swiper-wrapper'));
            },
            slideChange: function() {
              updateCustomPagination(this, body.querySelector('.detail-swiper-wrapper'));
            }
          }
        });
      }

      const ratingInputStars = body.querySelectorAll('#ratingStarsInputFull i');
      ratingInputStars.forEach(star => {
        const starRating = parseInt(star.dataset.rating);
        if (starRating <= rating) star.className = 'fas fa-star active';
        else star.className = 'far fa-star';
        star.addEventListener('click', () => {
          const newRating = parseInt(star.dataset.rating);
          updateRating(item.id, newRating);
          ratingInputStars.forEach(s => {
            if (parseInt(s.dataset.rating) <= newRating) s.className = 'fas fa-star active';
            else s.className = 'far fa-star';
          });
          const starsSpan = body.querySelector('.rating-stars-display');
          if (starsSpan) starsSpan.innerHTML = '★'.repeat(newRating) + '☆'.repeat(5 - newRating);
          const ratingSpan = body.querySelector('.detail-rating-full div:first-child span:last-child');
          if (ratingSpan) ratingSpan.innerHTML = `${newRating}/5`;
        });
      });
      
      const downloadBtn = body.querySelector('.download-btn-full');
      if (downloadBtn && linkValid) {
        downloadBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const url = downloadBtn.dataset.url;
          const id = downloadBtn.dataset.id;
          let target = allItems.find(i => i.id === id);
          if (target && db && isLinkValid(url)) {
            try {
              await db.collection('items').doc(id).update({
                downloads: (target.downloads || 0) + 1
              });
              target.downloads++;
              renderDetail(target);
            } catch (e) {}
          }
          if (url && url !== '#') window.open(url, '_blank');
          else showToast('⚠️ Download link not available!', true);
        });
      }

      const translateBtn = body.querySelector('#translateBtn');
      const langSelect = body.querySelector('#languageSelect');
      const descriptionTextEl = body.querySelector('#descriptionText');
      if (translateBtn) {
        translateBtn.addEventListener('click', async () => {
          const targetLang = langSelect.value;
          if (targetLang === 'en') {
            descriptionTextEl.innerHTML = safeEscape(originalDescription);
            showToast('✅ Back to English (Original)');
            return;
          }
          descriptionTextEl.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Translating...';
          const translated = await translateText(originalDescription, targetLang);
          descriptionTextEl.innerHTML = safeEscape(translated);
          showToast(`✅ Translated to ${langSelect.options[langSelect.selectedIndex].text}`);
        });
      }
    }

    function stopAllVideos(swiper) {
      if (!swiper) return;
      const slides = swiper.slides;
      slides.forEach(slide => {
        const iframe = slide.querySelector('iframe');
        if (iframe) {
          const src = iframe.src;
          if (src.includes('autoplay=1')) {
            iframe.src = src.replace('autoplay=1', 'autoplay=0');
          }
        }
      });
    }

    function playActiveVideo(swiper) {
      if (!swiper) return;
      const activeSlide = swiper.slides[swiper.activeIndex];
      const iframe = activeSlide ? activeSlide.querySelector('iframe') : null;
      if (iframe) {
        let src = iframe.src;
        if (!src.includes('autoplay=1')) {
          src = src.replace('autoplay=0', 'autoplay=1');
          if (!src.includes('autoplay')) {
            src += (src.includes('?') ? '&autoplay=1' : '?autoplay=1');
          }
          iframe.src = src;
        }
      }
    }

    function setupAutoplayControl(swiper, hasVideo) {
      if (!swiper) return;
      if (swiper.autoplay && swiper.autoplay.running) swiper.autoplay.stop();
      swiper.params.autoplay = false;
      stopAllVideos(swiper);
      if (hasVideo) {
        setTimeout(() => playActiveVideo(swiper), 500);
      }
      swiper.on('slideChange', () => {
        stopAllVideos(swiper);
        setTimeout(() => playActiveVideo(swiper), 100);
      });
    }

    function updateCustomPagination(swiper, container) {
      const totalSlides = swiper.slides.length;
      const currentIndex = swiper.realIndex;
      let paginationContainer = container.querySelector('.detail-swiper-pagination');
      if (!paginationContainer) {
        paginationContainer = document.createElement('div');
        paginationContainer.className = 'detail-swiper-pagination';
        container.appendChild(paginationContainer);
      }
      paginationContainer.innerHTML = '';
      for (let i = 0; i < totalSlides; i++) {
        const bullet = document.createElement('div');
        bullet.className = 'custom-pagination-bullet';
        if (i === currentIndex) bullet.classList.add('active');
        bullet.addEventListener('click', () => swiper.slideToLoop(i));
        paginationContainer.appendChild(bullet);
      }
    }

    async function updateRating(itemId, newRating) {
      if (!db) return;
      try {
        await db.collection('items').doc(itemId).update({
          rating: newRating
        });
        const item = allItems.find(i => i.id === itemId);
        if (item) item.rating = newRating;
        const msg = currentLanguage === 'id'
          ? `⭐ Rating berhasil diubah menjadi ${newRating}/5!`
          : `⭐ Rating changed to ${newRating}/5!`;
        showToast(msg);
        renderDetail(item);
      } catch (e) {
        showToast('Failed to save rating!', true);
      }
    }
    
    async function loadItemById(id) {
      if (!db) return null;
      try {
        const doc = await db.collection('items').doc(id).get();
        if (doc.exists) {
          const item = { id: doc.id, ...doc.data() };
          return item;
        }
        return null;
      } catch (e) {
        console.error('Error loading item:', e);
        return null;
      }
    }

    async function loadAllItems() {
      if (!db) return;
      try {
        const snap = await db.collection('items').get();
        const items = [];
        snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
        allItems = items;
      } catch (e) {
        allItems = [];
      }
    }

    async function startApp() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();

        firebase.initializeApp(config.firebase);
        db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        const saved = localStorage.getItem('faizcraft_language');
        currentLanguage = (saved === 'id' || saved === 'en') ? saved : 'en';

        const t = translations[currentLanguage];
        document.getElementById('detailTitleText').innerText = t.detailTitle;

        const itemId = getUrlParam('id');
        if (!itemId) {
          document.getElementById('detailBodyFull').innerHTML = `
            <div class="detail-error">
              <i class="fas fa-exclamation-circle"></i>
              <h2>No Item Specified</h2>
              <p>Please provide an item ID in the URL.</p>
              <a href="index.html">Back to Home</a>
            </div>
          `;
          return;
        }

        currentItemId = itemId;

        await loadAllItems();
        const item = await loadItemById(itemId);
        if (item) {
          renderDetail(item);
        } else {
          document.getElementById('detailBodyFull').innerHTML = `
            <div class="detail-error">
              <i class="fas fa-exclamation-circle"></i>
              <h2>Item Not Found</h2>
              <p>The item you're looking for doesn't exist or has been removed.</p>
              <a href="index.html">Back to Home</a>
            </div>
          `;
        }

        document.body.classList.add('detail-page');

      } catch (e) {
        console.error('Error:', e);
        document.getElementById('detailBodyFull').innerHTML = `
          <div class="detail-error">
            <i class="fas fa-exclamation-circle"></i>
            <h2>Connection Error</h2>
            <p>Failed to connect to server. Please try again later.</p>
            <a href="index.html">Back to Home</a>
          </div>
        `;
      }
    }

    startApp();
  </script>
</body>
</html>
